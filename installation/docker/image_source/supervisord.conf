[supervisord]
nodaemon=true
user=root

[program:Xvfb]
command=Xvfb :0 -screen 0 1024x768x24
autorestart=true
priority=10

[program:fluxbox]
command=fluxbox -display :0
environment=DISPLAY=":0"
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :0 -nopw -forever -shared
autorestart=true
priority=30

[program:websockify]
command=websockify --web=/usr/share/novnc/ 8080 localhost:5900
autorestart=true
priority=40

[program:torcs]
command=torcs
environment=DISPLAY=":0"
autorestart=true
priority=50